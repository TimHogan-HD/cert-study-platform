<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CompTIA Network+ (N10-009) study platform — interactive flashcards, guided subnetting practice, AI explanations, and comprehensive domain coverage." />
  <title>CSP · Cert Study Platform</title>
  <!-- Flash prevention: apply stored theme before CSS loads -->
  <script>(function(){var t=localStorage.getItem('csp-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<!-- ══════════ APP HEADER ══════════ -->
<header class="app-header">
  <button id="hamburger" class="hamburger" aria-label="Toggle navigation">☰</button>
  <button id="sidebar-desktop-toggle" class="sidebar-desktop-toggle" aria-label="Collapse sidebar" title="Toggle sidebar">‹</button>
  <button id="home-logo" class="header-logo" aria-label="Go to home screen">
    <span class="logo-badge">CSP</span>
    Cert Study
  </button>
  <div class="header-actions">
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">☀️</button>
  </div>
</header>
<div id="reading-progress" aria-hidden="true"></div>
<div id="sidebar-backdrop" aria-hidden="true"></div>

<!-- ══════════ LAYOUT ══════════ -->
<div class="layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" aria-label="Navigation"></aside>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="main" id="main-content">
    <div id="content-area">
      <div class="skeleton-loading">
        <div class="skeleton-line lg skeleton-pulse"></div>
        <div class="skeleton-line skeleton-pulse"></div>
        <div class="skeleton-line sm skeleton-pulse"></div>
        <div class="skeleton-block skeleton-pulse"></div>
        <div class="skeleton-line skeleton-pulse"></div>
        <div class="skeleton-line sm skeleton-pulse"></div>
      </div>
    </div>
  </main>

</div><!-- /.layout -->

<button id="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script type="module" src="js/theme.js"></script>
<script type="module" src="js/nav.js"></script>
</body>
</html>
