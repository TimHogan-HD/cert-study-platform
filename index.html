<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CompTIA Network+ (N10-009) study platform — interactive flashcards, subnetting calculator, AI explanations, and comprehensive domain coverage." />
  <title>CSP · Cert Study Platform</title>
  <!-- Flash prevention: apply stored theme before CSS loads -->
  <script>(function(){var t=localStorage.getItem('csp-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<!-- ══════════ APP HEADER ══════════ -->
<header class="app-header">
  <button id="hamburger" class="hamburger" aria-label="Toggle navigation">☰</button>
  <button id="home-logo" class="header-logo" aria-label="Go to home screen">
    <span class="logo-badge">CSP</span>
    Cert Study
  </button>
  <div class="header-actions">
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">☀️</button>
  </div>
</header>
<div id="reading-progress" aria-hidden="true"></div>
<div id="sidebar-backdrop" aria-hidden="true"></div>

<!-- ══════════ LAYOUT ══════════ -->
<div class="layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" aria-label="Navigation">

    <!-- Net+ sidebar -->
    <div id="sidebar-netplus">
      <div class="sidebar-cert-label">CompTIA Network+</div>
      <div class="sidebar-controls">
        <button id="sidebar-collapse-all" class="sidebar-ctrl-btn">Collapse all</button>
      </div>

      <button class="sidebar-link nav-overview" data-path="netplus/overview">📊 Exam Overview</button>

      <!-- Domain 1 -->
      <button class="domain-toggle open" aria-expanded="true">
        <span>Domain 1: Networking Concepts</span>
        <span class="domain-pct domain-pct-1">23%</span>
        <span class="toggle-arrow">▶</span>
      </button>
      <div class="domain-subnav open">
        <button class="obj-link" data-path="netplus/domain1/obj-1-1">1.1 OSI &amp; Network Models</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-2">1.2 Networking Devices</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-3">1.3 Network Topologies</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-4">1.4 Ports &amp; Protocols</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-5">1.5 Cables &amp; Media</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-6">1.6 Network Services</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-7">1.7 IPv4 &amp; Subnetting</button>
        <button class="obj-link" data-path="netplus/domain1/obj-1-8">1.8 IPv6 Addressing</button>
      </div>

      <!-- Domain 2 -->
      <button class="domain-toggle" aria-expanded="false">
        <span>Domain 2: Network Implementation</span>
        <span class="domain-pct domain-pct-2">20%</span>
        <span class="toggle-arrow">▶</span>
      </button>
      <div class="domain-subnav">
        <button class="obj-link" data-path="netplus/domain2/obj-2-1">2.1 Routing Technologies</button>
        <button class="obj-link" data-path="netplus/domain2/obj-2-2">2.2 Switching &amp; VLANs</button>
        <button class="obj-link" data-path="netplus/domain2/obj-2-3">2.3 Wireless Standards</button>
        <button class="obj-link" data-path="netplus/domain2/obj-2-4">2.4 Physical Installation</button>
      </div>

      <!-- Domain 3 -->
      <button class="domain-toggle" aria-expanded="false">
        <span>Domain 3: Network Operations</span>
        <span class="domain-pct domain-pct-3">19%</span>
        <span class="toggle-arrow">▶</span>
      </button>
      <div class="domain-subnav">
        <button class="obj-link" data-path="netplus/domain3/obj-3-1">3.1 Documentation &amp; Monitoring</button>
        <button class="obj-link" data-path="netplus/domain3/obj-3-2">3.2 Monitoring Tools</button>
        <button class="obj-link" data-path="netplus/domain3/obj-3-3">3.3 DHCP, DNS &amp; NTP</button>
        <button class="obj-link" data-path="netplus/domain3/obj-3-4">3.4 Remote Access &amp; AAA</button>
        <button class="obj-link" data-path="netplus/domain3/obj-3-5">3.5 Policies &amp; Disaster Recovery</button>
      </div>

      <!-- Domain 4 -->
      <button class="domain-toggle" aria-expanded="false">
        <span>Domain 4: Network Security</span>
        <span class="domain-pct domain-pct-4">14%</span>
        <span class="toggle-arrow">▶</span>
      </button>
      <div class="domain-subnav">
        <button class="obj-link" data-path="netplus/domain4/obj-4-1">4.1 Security Concepts</button>
        <button class="obj-link" data-path="netplus/domain4/obj-4-2">4.2 Attack Types</button>
        <button class="obj-link" data-path="netplus/domain4/obj-4-3">4.3 Hardening &amp; Defense</button>
      </div>

      <!-- Domain 5 -->
      <button class="domain-toggle" aria-expanded="false">
        <span>Domain 5: Network Troubleshooting</span>
        <span class="domain-pct domain-pct-5">24%</span>
        <span class="toggle-arrow">▶</span>
      </button>
      <div class="domain-subnav">
        <button class="obj-link" data-path="netplus/domain5/obj-5-1">5.1 Troubleshooting Methodology</button>
        <button class="obj-link" data-path="netplus/domain5/obj-5-2">5.2 Cable &amp; Physical Issues</button>
        <button class="obj-link" data-path="netplus/domain5/obj-5-3">5.3 Network Issues</button>
        <button class="obj-link" data-path="netplus/domain5/obj-5-4">5.4 Wireless Issues</button>
        <button class="obj-link" data-path="netplus/domain5/obj-5-5">5.5 Security Issues</button>
      </div>

      <div class="sidebar-divider"></div>
      <button class="sidebar-study-plans" data-path="netplus/study-plans">📅 Study Plans</button>
    </div>

    <!-- Sec+ sidebar (hidden by default) -->
    <div id="sidebar-secplus" style="display:none;">
      <div class="sidebar-cert-label">CompTIA Security+</div>
      <div style="padding:0.75rem 0.6rem;font-size:0.82rem;color:var(--muted);">Content coming soon.</div>
    </div>

    <!-- AZ-104 sidebar (hidden by default) -->
    <div id="sidebar-az104" style="display:none;">
      <div class="sidebar-cert-label">AZ-104 Azure Admin</div>
      <div style="padding:0.75rem 0.6rem;font-size:0.82rem;color:var(--muted);">Content coming soon.</div>
    </div>

  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="main" id="main-content">
    <div id="content-area">
      <div class="skeleton-loading">
        <div class="skeleton-line lg skeleton-pulse"></div>
        <div class="skeleton-line skeleton-pulse"></div>
        <div class="skeleton-line sm skeleton-pulse"></div>
        <div class="skeleton-block skeleton-pulse"></div>
        <div class="skeleton-line skeleton-pulse"></div>
        <div class="skeleton-line sm skeleton-pulse"></div>
      </div>
    </div>
  </main>

</div><!-- /.layout -->

<button id="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script type="module" src="js/theme.js"></script>
<script type="module" src="js/nav.js"></script>
</body>
</html>
